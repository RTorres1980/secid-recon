apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secid-recon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secid-recon
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secid-recon
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secid-recon
---
# Allow inbound traffic only on the service port; allow outbound DNS and
# HTTPS (for api.openfigi.com).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secid-recon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secid-recon
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
