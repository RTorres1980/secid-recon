name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate rendered manifests
        run: |
          for dir in k8s/base k8s/overlays/local; do
            kubectl kustomize "$dir" | kubeconform -strict -summary -kubernetes-version 1.30.0 -
          done

  kind-smoke-test:
    runs-on: ubuntu-latest
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t secid-recon:dev .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: secid
      - name: Load image and deploy
        run: |
          kind load docker-image secid-recon:dev --name secid
          kubectl apply -k k8s/overlays/local
          kubectl -n secid-recon rollout status deployment/secid-recon --timeout=120s
      - name: Smoke test the API
        run: |
          kubectl -n secid-recon port-forward svc/secid-recon 8080:80 &
          sleep 3
          curl -fsS localhost:8080/healthz
          curl -fsS -X POST localhost:8080/v1/convert \
            -H 'content-type: application/json' \
            -d '{"identifier":"037833100","to":"ISIN"}' | tee /tmp/out.json
          grep -q US0378331005 /tmp/out.json
      - name: Debug on failure
        if: failure()
        run: kubectl -n secid-recon describe pods; kubectl -n secid-recon logs -l app.kubernetes.io/name=secid-recon --tail=100
